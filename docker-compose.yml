# Local dev convenience: run the backend in one command.
# The frontend runs separately with `cd frontend && npm run dev`.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
